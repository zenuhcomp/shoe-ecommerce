<div class="admin-shell" [class.sidebar-collapsed]="!sidebarOpen()">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark">◆</div>
      <div class="brand-text">
        <strong>Universal CMS</strong>
        <small>Adaptive E-Commerce</small>
      </div>
      <button class="collapse-btn" (click)="toggleSidebar()" title="Toggle sidebar">
        {{ sidebarOpen() ? '◁' : '▷' }}
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          <span class="nav-group-label">{{ group.label }}</span>
          @for (item of group.items; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              [title]="item.label"
            >
              <span class="nav-icon">{{ item.icon }}</span>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </nav>

    <div class="sidebar-foot">
      <a routerLink="/" target="_blank" rel="noopener" class="live-site-link">
        <span class="nav-icon">↗</span>
        <span class="nav-label">View Live Site</span>
      </a>
      <button type="button" class="logout-btn" (click)="logout()">
        <span class="nav-icon">⏻</span>
        <span class="nav-label">Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="content">
    <router-outlet />
  </main>
</div>
